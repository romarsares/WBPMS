; WBPMS PHP runtime configuration
; Applied on top of the base php.ini-production defaults.

; ── Error handling ──────────────────────────────────────────
; production: errors are logged, not displayed
display_errors       = Off
display_startup_errors = Off
log_errors           = On
error_reporting      = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ── Timezone ─────────────────────────────────────────────────
date.timezone        = Asia/Manila

; ── File uploads ─────────────────────────────────────────────
; XLS biometric files are typically <5 MB; allow 20 MB headroom
file_uploads         = On
upload_max_filesize  = 20M
post_max_size        = 22M
max_file_uploads     = 5

; ── Memory / execution ───────────────────────────────────────
memory_limit         = 256M
max_execution_time   = 60
max_input_time       = 60

; ── Sessions ─────────────────────────────────────────────────
; Stored in the database via DatabaseSessionHandler (ADR-0001)
session.gc_maxlifetime = 1800
; Strict mode: reject unknown session IDs sent by the browser.
; Forces a new ID + Set-Cookie when a stale or forged cookie arrives —
; prevents CSRF failures after a database restore or redeployment.
session.use_strict_mode = 1

; ── OPcache ───────────────────────────────────────────────────
opcache.enable          = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files   = 4000
opcache.revalidate_freq         = 60
opcache.fast_shutdown           = 1
